name: APK bouwen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'content.json'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK bouwen
        run: gradle assembleRelease --no-daemon
      - name: Hernoemen
        run: cp app/build/outputs/apk/release/app-release.apk PeikeGTA6.apk
      - name: Op de downloadpagina zetten
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Peike's GTA VI Gids (Android)
          body: |
            Download **PeikeGTA6.apk** hieronder en open het op de Android-telefoon.
            Nieuwe tips en easter eggs komen vanzelf binnen via de knop "Check op nieuwe updates" in de app.
          files: PeikeGTA6.apk
          make_latest: true
